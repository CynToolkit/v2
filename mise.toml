[tools]
node = "24"
pnpm = "10.33.0"
supabase = "3.2.0"

[tasks.install]
description = "Install workspace dependencies"
run = "pnpm install"

# Cloud features are optional and stay off unless
# their variables are set in the environment or a root .env.
[tasks.dev]
description = "Run the standalone UI and CLI backend; cloud features turn on when their variables are set"
run = "pnpm exec turbo run dev:remote --filter=@pipelab/cli --filter=@pipelab/ui"
depends = ["install"]

[tasks.desktop]
description = "Run the desktop app"
run = "pnpm dev"
dir = "apps/desktop"
depends = ["install"]

[tasks."supabase:setup"]
description = "Start local Supabase and apply migrations"
run = "supabase start && supabase migration up"

[tasks."deploy:artifacts"]
description = "Deploy the Pipelab Cloud Worker and upload its secrets"
run = "pnpm --filter @pipelab/cloud-workers deploy && pnpm --filter @pipelab/cloud-workers deploy:secrets"
depends = ["install"]

[tasks."deploy:supabase-functions"]
description = "Deploy Supabase Edge Functions to the project in SUPABASE_PROJECT_REF"
run = 'supabase functions deploy --remote="${SUPABASE_PROJECT_REF:?Set SUPABASE_PROJECT_REF to the approved Supabase project}"'

[tasks."setup:construct"]
description = "Seed the signed-in Chromium profile used by Construct exports"
run = 'pnpm --filter @pipelab/providers exec playwright install chromium && node scripts/setup/construct-profile.mjs'
depends = ["install"]

[tasks."setup:poki"]
description = "Save a Poki login without a local browser (POKI_LOGIN_URL, or paste the URL when prompted)"
run = "node scripts/setup/poki-login.mjs"
raw = true
depends = ["install"]

[tasks.setup-providers]
description = "Run every provider setup task (Construct profile, Poki login)"
run = [{ task = "setup:construct" }, { task = "setup:poki" }]
