name: Deploy Editor UI

on:
  push:
    branches: [main]
    paths:
      - 'apps/ui/**'
      - 'packages/**'
      - 'plugins/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-editor.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/ui/**'
      - 'packages/**'
      - 'plugins/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-editor.yml'
      - '.github/actions/upsert-preview-comment/action.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-editor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor UI
        env:
          VITE_PIPELAB_MODE: ${{ github.event_name == 'pull_request' && 'hosted' || '' }}
          SUPABASE_URL: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && secrets.SUPABASE_URL || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY) || '' }}
          SUPABASE_PROJECT_ID: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && secrets.SUPABASE_PROJECT_ID || '' }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: pnpm --filter @pipelab/ui build

      - name: Validate Cloudflare deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_EDITOR_UI_PROJECT_NAME }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID secret}"
          : "${CLOUDFLARE_PROJECT_NAME:?Missing CLOUDFLARE_EDITOR_UI_PROJECT_NAME secret}"

      - name: Resolve Cloudflare Pages branch
        id: branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            # GitHub main publishes to the existing Pages project's production branch.
            branch='develop'
          else
            branch="pr-${PR_NUMBER}"
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy editor UI to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/ui/dist --project-name=${{ secrets.CLOUDFLARE_EDITOR_UI_PROJECT_NAME }} --branch=${{ steps.branch.outputs.name }}

      - name: Post editor preview comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/upsert-preview-comment
        with:
          name: Editor
          url: ${{ steps.deploy.outputs.deployment-url }}
          marker: "<!-- pipelab-preview-editor -->"
