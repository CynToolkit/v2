name: Deploy Editor UI

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: Explicitly allow an editor Pages deployment
        required: true
        type: boolean
        default: false
      target:
        description: Pages branch to deploy
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
      confirm_production:
        description: Explicitly allow a production deployment from main
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ inputs.confirm_deployment && vars.ENABLE_PAGES_DEPLOYMENTS == 'true' && (inputs.target != 'production' || (inputs.confirm_production && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_DEPLOYMENTS == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor UI
        env:
          VITE_PIPELAB_MODE: ${{ inputs.target == 'preview' && 'hosted' || '' }}
          SUPABASE_URL: ${{ inputs.target == 'production' && vars.ENABLE_PRODUCTION_BILLING == 'true' && secrets.SUPABASE_URL || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ inputs.target == 'production' && vars.ENABLE_PRODUCTION_BILLING == 'true' && (secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY) || '' }}
          SUPABASE_PROJECT_ID: ${{ inputs.target == 'production' && vars.ENABLE_PRODUCTION_BILLING == 'true' && secrets.SUPABASE_PROJECT_ID || '' }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          pnpm --filter @pipelab/ui build

      - name: Resolve Cloudflare branch name
        id: branch
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
        run: |
          if [[ "$DEPLOY_TARGET" == 'production' ]]; then
            branch='main'
          else
            branch='v2-migration-preview'
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy editor UI to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/ui/dist --project-name=${{ secrets.CLOUDFLARE_EDITOR_UI_PROJECT_NAME }} --branch=${{ steps.branch.outputs.name }}
