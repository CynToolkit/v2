name: CI & Release

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_authenticated_local_ship:
        description: Run disposable-profile Construct to Electron acceptance on all three platforms
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event_name == 'workflow_dispatch' && 'dispatch-' || '' }}${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  local-release-platforms:
    name: Local release checks / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local release workflow and artifact tests
        run: pnpm --filter @pipelab/cli test:release-platforms

      - name: Run run-history recovery tests
        run: pnpm --filter @pipelab/core-node test

      - name: Run Desktop IPC and artifact tests
        run: pnpm --filter @pipelab/app test

      - name: Install Playwright Chromium for the WebGL launch test
        run: pnpm --filter @pipelab/providers exec playwright install chromium

      - name: Run Construct profile validation tests
        run: pnpm --filter @pipelab/providers test:construct

  authenticated-local-release:
    name: Smoke Construct to Electron / ${{ matrix.os }}
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_authenticated_local_ship)
    needs: ci-passed
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require the disposable Construct CI test account
        shell: bash
        env:
          CONSTRUCT_CI_USERNAME: ${{ secrets.CONSTRUCT_CI_USERNAME }}
          CONSTRUCT_CI_PASSWORD: ${{ secrets.CONSTRUCT_CI_PASSWORD }}
        run: |
          if [[ -z "$CONSTRUCT_CI_USERNAME" || -z "$CONSTRUCT_CI_PASSWORD" ]]; then
            echo "::error::Configure CONSTRUCT_CI_USERNAME and CONSTRUCT_CI_PASSWORD for authenticated local release acceptance."
            exit 1
          fi

      - name: Create isolated CI application and browser-profile directories
        run: node apps/cli/scripts/prepare-local-ci-data.mjs

      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: pnpm --filter @pipelab/providers exec playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os != 'Linux'
        run: pnpm --filter @pipelab/providers exec playwright install chromium

      - name: Populate disposable Construct profile through the Construct editor
        env:
          CONSTRUCT_CI_USERNAME: ${{ secrets.CONSTRUCT_CI_USERNAME }}
          CONSTRUCT_CI_PASSWORD: ${{ secrets.CONSTRUCT_CI_PASSWORD }}
        run: node packages/providers/scripts/prepare-construct-ci-profile.mjs

      # Smoke scenario (every push to main): real Construct export, Electron build delivered to a
      # local folder, then a second Ship that must preserve the first run's history and artifacts.
      - name: Run first authenticated Construct to Electron Ship
        env:
          CONSTRUCT_CI_RUN_NUMBER: "1"
          CONSTRUCT_CI_REQUIRED: "true"
          NODE_ENV: development
        run: pnpm --filter @pipelab/cli exec vitest run -c tests/e2e/vitest.config.mts tests/e2e/tests/construct-electron-live.spec.ts

      # Steps that drive the Desktop app run on manual dispatches only until they pass reliably.
      - name: Cold-start Desktop and verify the first run (Linux)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        env:
          NODE_ENV: development
          PIPELAB_E2E_HISTORY_PATH: /workflows/ci-construct-electron-acceptance/ci-project/runs
          PIPELAB_E2E_EXPECTED_RUNS: "1"
        run: xvfb-run -a pnpm --filter @pipelab/app test:local-release-e2e

      - name: Cold-start Desktop and verify the first run (Windows and macOS)
        if: github.event_name == 'workflow_dispatch' && runner.os != 'Linux'
        env:
          NODE_ENV: development
          PIPELAB_E2E_HISTORY_PATH: /workflows/ci-construct-electron-acceptance/ci-project/runs
          PIPELAB_E2E_EXPECTED_RUNS: "1"
        run: pnpm --filter @pipelab/app test:local-release-e2e

      - name: Refresh disposable Construct profile before the second Ship
        env:
          CONSTRUCT_CI_USERNAME: ${{ secrets.CONSTRUCT_CI_USERNAME }}
          CONSTRUCT_CI_PASSWORD: ${{ secrets.CONSTRUCT_CI_PASSWORD }}
        run: node packages/providers/scripts/prepare-construct-ci-profile.mjs

      - name: Run a second Ship and verify saved history and prior artifacts
        env:
          CONSTRUCT_CI_RUN_NUMBER: "2"
          CONSTRUCT_CI_REQUIRED: "true"
          NODE_ENV: development
        run: pnpm --filter @pipelab/cli exec vitest run -c tests/e2e/vitest.config.mts tests/e2e/tests/construct-electron-live.spec.ts

      - name: Cold-start Desktop and verify both runs and artifacts (Linux)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Linux'
        env:
          NODE_ENV: development
          PIPELAB_E2E_HISTORY_PATH: /workflows/ci-construct-electron-acceptance/ci-project/runs
          PIPELAB_E2E_EXPECTED_RUNS: "2"
        run: xvfb-run -a pnpm --filter @pipelab/app test:local-release-e2e

      - name: Cold-start Desktop and verify both runs and artifacts (Windows and macOS)
        if: github.event_name == 'workflow_dispatch' && runner.os != 'Linux'
        env:
          NODE_ENV: development
          PIPELAB_E2E_HISTORY_PATH: /workflows/ci-construct-electron-acceptance/ci-project/runs
          PIPELAB_E2E_EXPECTED_RUNS: "2"
        run: pnpm --filter @pipelab/app test:local-release-e2e

      - name: Ship through the Desktop wizard to a running Electron binary
        if: github.event_name == 'workflow_dispatch'
        env:
          NODE_ENV: development
          # Chromium ignores --no-sandbox after pnpm's "--", and hosted Linux has no SUID sandbox.
          ELECTRON_DISABLE_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}
        run: pnpm --filter @pipelab/cli exec vitest run -c tests/e2e/vitest.config.mts tests/e2e/tests/construct-ui-to-binary.spec.ts

  verify:
    name: CI / ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ matrix.task }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ matrix.task }}-
            ${{ runner.os }}-${{ runner.arch }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Deno
        if: matrix.task == 'test'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.9

      - name: Check for dead code
        if: matrix.task == 'lint'
        run: pnpm knip

      - name: Check formatting of changed files
        if: matrix.task == 'lint' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD \
            | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|mts|cts|vue|json|jsonc|md|css|scss|html|ya?ml)$' \
            | xargs -r pnpm exec oxfmt --check --no-error-on-unmatched-pattern

      - name: Run verification
        if: matrix.task != 'build'
        run: pnpm ${{ matrix.task }} --concurrency=2

      - name: Verify Supabase billing functions
        if: matrix.task == 'test'
        run: |
          deno lint \
            supabase/functions/_shared/billing.ts \
            supabase/functions/_shared/billing.test.ts \
            supabase/functions/polar-user-plan/index.ts \
            supabase/functions/polar-available-plans/index.ts \
            supabase/functions/customer-portal/index.ts \
            supabase/functions/checkout/index.ts
          deno check \
            supabase/functions/polar-user-plan/index.ts \
            supabase/functions/polar-available-plans/index.ts \
            supabase/functions/customer-portal/index.ts \
            supabase/functions/checkout/index.ts
          deno test supabase/functions/_shared/billing.test.ts

      - name: Build
        if: matrix.task == 'build'
        env:
          SUPABASE_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SUPABASE_URL || '' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (secrets.SUPABASE_PUBLISHABLE_KEY) || '' }}
          SUPABASE_PROJECT_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SUPABASE_PROJECT_ID || '' }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          PRIME_UI_KEY: ${{ secrets.PRIME_UI_KEY }}
        run: pnpm build --concurrency=2

      - name: Package Linux desktop smoke
        if: matrix.task == 'build'
        run: pnpm --filter @pipelab/app package

      - name: Save website build
        if: matrix.task == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: web-website
          include-hidden-files: true
          path: apps/website/dist
          if-no-files-found: error

      - name: Save documentation build
        if: matrix.task == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: web-documentation
          include-hidden-files: true
          path: apps/documentation/.vitepress/dist
          if-no-files-found: error

  dependency-audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  ci-passed:
    name: CI passed
    if: always()
    needs: [verify, local-release-platforms, dependency-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          PLATFORM_RESULT: ${{ needs.local-release-platforms.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$PLATFORM_RESULT" = success
          test "$AUDIT_RESULT" = success

  changes:
    name: Select web deployments
    runs-on: ubuntu-latest
    outputs:
      editor: ${{ steps.paths.outputs.editor }}
      website: ${{ steps.paths.outputs.website }}
      documentation: ${{ steps.paths.outputs.documentation }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Match deployment paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          files="$RUNNER_TEMP/changed-files"
          all=false
          # Every successful push must catch up apps skipped by earlier failed/cancelled runs.
          if [[ "$EVENT_NAME" == push || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            all=true
            touch "$files"
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$files"
          fi
          common='^(package[.]json|pnpm-lock[.]yaml|pnpm-workspace[.]yaml|turbo[.]json|[.]npmrc|[.]github/workflows/.*[.]yml|[.]github/actions/)'
          for app in editor website documentation; do
            case "$app" in
              editor) paths='^(apps/ui/|packages/)' ;;
              website) paths='^(apps/website/|packages/)' ;;
              documentation) paths='^apps/documentation/' ;;
            esac
            changed=false
            if [[ "$all" == true ]] || grep -Eq "$common|$paths" "$files"; then
              changed=true
            fi
            echo "$app=$changed" >> "$GITHUB_OUTPUT"
          done

  deploy-editor:
    needs: [ci-passed, changes]
    if: >-
      needs.changes.outputs.editor == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    uses: ./.github/workflows/deploy-editor.yml
    secrets: inherit

  deploy-website:
    needs: [ci-passed, changes]
    if: >-
      needs.changes.outputs.website == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    uses: ./.github/workflows/deploy-website.yml
    secrets: inherit

  deploy-documentation:
    needs: [ci-passed, changes]
    if: >-
      needs.changes.outputs.documentation == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-documentation.yml
    secrets: inherit

  changesets:
    needs: ci-passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Version or publish Pipelab
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create version pull request or publish CLI
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          PRIME_UI_KEY: ${{ secrets.PRIME_UI_KEY }}

      - name: Read published version
        id: version
        if: steps.changesets.outputs.published == 'true'
        run: node -p "'version=' + require('./apps/cli/package.json').version" >> "$GITHUB_OUTPUT"

  build:
    needs: changesets
    if: needs.changesets.outputs.published == 'true'
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-26-intel
            arch: x64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Confirm shared desktop and CLI version
        env:
          RELEASE_VERSION: ${{ needs.changesets.outputs.version }}
        shell: bash
        run: |
          actual_version=$(node -p "require('./apps/desktop/package.json').version")
          [[ "$RELEASE_VERSION" == "$actual_version" ]]

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Validate macOS signing configuration
        id: apple_signing
        if: startsWith(matrix.os, 'macos-')
        env:
          PRERELEASE: ${{ contains(needs.changesets.outputs.version, '-') }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERTIFICATE_OSX_APPLICATION: ${{ secrets.CERTIFICATE_OSX_APPLICATION }}
          CERTIFICATE_OSX_APPLICATION_PASSWORD: ${{ secrets.CERTIFICATE_OSX_APPLICATION_PASSWORD }}
        run: node apps/desktop/scripts/mac-signing-policy.mjs >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop runtime dependencies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          PRIME_UI_KEY: ${{ secrets.PRIME_UI_KEY }}
        run: pnpm exec turbo build --filter=@pipelab/app... --filter=@pipelab/cli... --concurrency=2

      - name: Import Apple Code Signing Certificate
        if: startsWith(matrix.os, 'macos-') && steps.apple_signing.outputs.mode == 'developer-id'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_OSX_APPLICATION }}
          p12-password: ${{ secrets.CERTIFICATE_OSX_APPLICATION_PASSWORD }}

      - name: Package desktop release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          PRIME_UI_KEY: ${{ secrets.PRIME_UI_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET_ARCH: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.arch }}
          PRERELEASE: ${{ contains(needs.changesets.outputs.version, '-') }}
        run: pnpm --filter @pipelab/app make -- --arch=${{ matrix.arch }}

      - name: Verify macOS executable architecture
        if: startsWith(matrix.os, 'macos-')
        env:
          EXPECTED_ARCH: ${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
        shell: bash
        run: |
          app=$(find apps/desktop/out -type d -name '*.app' -print -quit)
          test -n "$app"
          executable=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -print -quit)
          test -n "$executable"
          architectures=$(lipo -archs "$executable")
          echo "Built architectures: $architectures"
          [[ " $architectures " == *" $EXPECTED_ARCH "* ]]

      - name: Verify macOS code signature
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          app=$(find apps/desktop/out -type d -name '*.app' -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Verify Developer ID signature identity
        if: startsWith(matrix.os, 'macos-') && steps.apple_signing.outputs.mode == 'developer-id'
        shell: bash
        run: |
          app=$(find apps/desktop/out -type d -name '*.app' -print -quit)
          test -n "$app"
          signature=$(codesign -dv --verbose=4 "$app" 2>&1)
          grep -q 'Authority=Developer ID Application:' <<< "$signature"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: [changesets, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from changelog
        env:
          RELEASE_VERSION: ${{ needs.changesets.outputs.version }}
        run: node scripts/release-notes.mjs "$RELEASE_VERSION" > release-notes.md

      - name: Publish or update same-tag release
        uses: softprops/action-gh-release@v3
        with:
          name: "v${{ needs.changesets.outputs.version }}"
          tag_name: "@pipelab/app@${{ needs.changesets.outputs.version }}"
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(needs.changesets.outputs.version, '-') }}
          body_path: release-notes.md
          overwrite_files: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
