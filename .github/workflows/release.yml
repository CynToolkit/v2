name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changesets:
    name: Version or publish Pipelab
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create version pull request or publish CLI
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

      - name: Read published version
        id: version
        if: steps.changesets.outputs.published == 'true'
        run: node -p "'version=' + require('./apps/cli/package.json').version" >> "$GITHUB_OUTPUT"

  build:
    needs: changesets
    if: needs.changesets.outputs.published == 'true'
    name: Build (${{ matrix.os }} / ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-26-intel
            arch: x64
          - os: macos-26
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Confirm shared desktop and CLI version
        env:
          RELEASE_VERSION: ${{ needs.changesets.outputs.version }}
        shell: bash
        run: |
          actual_version=$(node -p "require('./apps/desktop/package.json').version")
          [[ "$RELEASE_VERSION" == "$actual_version" ]]

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Validate macOS signing configuration
        id: apple_signing
        if: startsWith(matrix.os, 'macos-')
        env:
          PRERELEASE: ${{ contains(needs.changesets.outputs.version, '-') }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERTIFICATE_OSX_APPLICATION: ${{ secrets.CERTIFICATE_OSX_APPLICATION }}
          CERTIFICATE_OSX_APPLICATION_PASSWORD: ${{ secrets.CERTIFICATE_OSX_APPLICATION_PASSWORD }}
        run: node apps/desktop/scripts/mac-signing-policy.mjs >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop runtime dependencies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: pnpm exec turbo build --filter=@pipelab/app... --filter=@pipelab/cli... --concurrency=2

      - name: Import Apple Code Signing Certificate
        if: startsWith(matrix.os, 'macos-') && steps.apple_signing.outputs.mode == 'developer-id'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CERTIFICATE_OSX_APPLICATION }}
          p12-password: ${{ secrets.CERTIFICATE_OSX_APPLICATION_PASSWORD }}

      - name: Package desktop release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET_ARCH: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.arch }}
          PRERELEASE: ${{ contains(needs.changesets.outputs.version, '-') }}
        run: pnpm --filter @pipelab/app make -- --arch=${{ matrix.arch }}

      - name: Verify macOS executable architecture
        if: startsWith(matrix.os, 'macos-')
        env:
          EXPECTED_ARCH: ${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
        shell: bash
        run: |
          app=$(find apps/desktop/out -type d -name '*.app' -print -quit)
          test -n "$app"
          executable=$(find "$app/Contents/MacOS" -maxdepth 1 -type f -print -quit)
          test -n "$executable"
          architectures=$(lipo -archs "$executable")
          echo "Built architectures: $architectures"
          [[ " $architectures " == *" $EXPECTED_ARCH "* ]]

      - name: Verify macOS code signature
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        run: |
          app=$(find apps/desktop/out -type d -name '*.app' -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Verify Developer ID signature identity
        if: startsWith(matrix.os, 'macos-') && steps.apple_signing.outputs.mode == 'developer-id'
        shell: bash
        run: |
          app=$(find apps/desktop/out -type d -name '*.app' -print -quit)
          test -n "$app"
          signature=$(codesign -dv --verbose=4 "$app" 2>&1)
          grep -q 'Authority=Developer ID Application:' <<< "$signature"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: apps/desktop/out/make/**/*
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: [changesets, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Publish or update same-tag release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: '@pipelab/app@${{ needs.changesets.outputs.version }}'
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(needs.changesets.outputs.version, '-') }}
          overwrite_files: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/RELEASES
            artifacts/**/*.nupkg
            artifacts/**/*.deb
            artifacts/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
