name: Deploy Documentation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download verified documentation build
        uses: actions/download-artifact@v8
        with:
          name: web-documentation
          path: apps/documentation/.vitepress/dist

      - name: Validate Cloudflare deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_DOCS_PROJECT_NAME }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID secret}"
          : "${CLOUDFLARE_PROJECT_NAME:?Missing CLOUDFLARE_DOCS_PROJECT_NAME secret}"

      - name: Resolve Cloudflare Pages branch
        id: branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            branch="pr-${PR_NUMBER}"
          else
            branch="$REF_NAME"
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Deploy documentation to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/documentation/.vitepress/dist --project-name=${{ secrets.CLOUDFLARE_DOCS_PROJECT_NAME }} --branch=${{ steps.branch.outputs.name }}
