# Weekly dependency updates. Security advisories are enforced separately by the
# "Dependency advisories" job in .github/workflows/release.yml.
version: 2
updates:
  # pnpm workspace: Dependabot reads pnpm-lock.yaml from the root and updates every workspace.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-minor-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    # Major bumps (for example Electron or Vite) stay one PR per package.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns: ["*"]
